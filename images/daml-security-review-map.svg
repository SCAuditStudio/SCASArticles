<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Daml security review map</title>
  <desc id="desc">A Daml choice connects authority, state, privacy, and version questions that reviewers should trace through the transaction tree.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="44" y="42" width="1112" height="546" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="86" y="105" fill="#17202a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Review the full Daml transaction tree</text>
  <text x="86" y="143" fill="#475569" font-family="Arial, sans-serif" font-size="20">A valid transaction can still encode the wrong agreement.</text>

  <line x1="600" y1="315" x2="330" y2="245" stroke="#94a3b8" stroke-width="4"/>
  <line x1="600" y1="315" x2="870" y2="245" stroke="#94a3b8" stroke-width="4"/>
  <line x1="600" y1="315" x2="330" y2="455" stroke="#94a3b8" stroke-width="4"/>
  <line x1="600" y1="315" x2="870" y2="455" stroke="#94a3b8" stroke-width="4"/>

  <rect x="480" y="235" width="240" height="160" rx="8" fill="#17202a"/>
  <text x="600" y="292" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">CHOICE</text>
  <text x="600" y="329" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">Trace every create,</text>
  <text x="600" y="356" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">exercise, fetch, archive</text>

  <rect x="105" y="178" width="300" height="134" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <circle cx="144" cy="219" r="16" fill="#ea580c"/>
  <text x="176" y="227" fill="#7c2d12" font-family="Arial, sans-serif" font-size="23" font-weight="700">Authority</text>
  <text x="144" y="263" fill="#7c2d12" font-family="Arial, sans-serif" font-size="18">Who signs and controls?</text>
  <text x="144" y="289" fill="#7c2d12" font-family="Arial, sans-serif" font-size="18">What authority is delegated?</text>

  <rect x="795" y="178" width="300" height="134" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <circle cx="834" cy="219" r="16" fill="#059669"/>
  <text x="866" y="227" fill="#065f46" font-family="Arial, sans-serif" font-size="23" font-weight="700">State</text>
  <text x="834" y="263" fill="#065f46" font-family="Arial, sans-serif" font-size="18">What is consumed or created?</text>
  <text x="834" y="289" fill="#065f46" font-family="Arial, sans-serif" font-size="18">Can the effect repeat?</text>

  <rect x="105" y="398" width="300" height="134" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="144" cy="439" r="16" fill="#2563eb"/>
  <text x="176" y="447" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="23" font-weight="700">Privacy</text>
  <text x="144" y="483" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="18">Who sees the payload?</text>
  <text x="144" y="509" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="18">Who sees the consequences?</text>

  <rect x="795" y="398" width="300" height="134" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="3"/>
  <circle cx="834" cy="439" r="16" fill="#ca8a04"/>
  <text x="866" y="447" fill="#713f12" font-family="Arial, sans-serif" font-size="23" font-weight="700">Version</text>
  <text x="834" y="483" fill="#713f12" font-family="Arial, sans-serif" font-size="18">Which package executes?</text>
  <text x="834" y="509" fill="#713f12" font-family="Arial, sans-serif" font-size="18">Which platform rules apply?</text>
</svg>
